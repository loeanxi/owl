<script>
(()=>{
 const prompt='Generate an SVG of a pelican riding a bicycle.';
 const thoughts=['先确定自行车、鹈鹕和脚踏板之间的空间关系。','鸟身需要在车座上方，长喙朝前，双脚分别落在两侧踏板。','最后补上车轮与轮辐，并用简洁的配色保持画面清晰。'];
 const rubric=['结构关系','动作表达','视觉清晰度'];
 function scene(model){const frame=model==='A'?'#3d8067':'#d47c43';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 225" aria-label="鹈鹕骑自行车的示例 SVG"><rect width="380" height="225" fill="#dfece3"/><circle cx="305" cy="37" r="19" fill="#f7efd0"/><path d="M0 181Q110 156 200 179T380 177V225H0Z" fill="#c5d9c6"/><path d="M0 198H380" stroke="#99b7a0"/><g fill="none" stroke="#345049" stroke-width="4"><circle cx="101" cy="173" r="38"/><circle cx="281" cy="173" r="38"/></g><g stroke="#99b3a5" stroke-width="1.3"><path d="M63 173h76m-38-38v76m-27-65 54 54m0-54-54 54M243 173h76m-38-38v76m-27-65 54 54m0-54-54 54"/></g><g fill="none" stroke="${frame}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M101 173 154 115 189 173H101l88-0 71-58 21 58M154 115h106M148 112h25M259 116l-7-23h18"/></g><circle cx="189" cy="173" r="5" fill="#345049"/><path d="M174 93 164 126 188 163M199 104l18 33-23 36" fill="none" stroke="#dd9f3a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M193 173h-14M188 163h12" stroke="#345049" stroke-width="4" stroke-linecap="round"/><ellipse cx="178" cy="91" rx="47" ry="23" fill="#fffdf5" stroke="#c0d3c4"/><path d="M204 84q14-27 32-38" fill="none" stroke="#fffdf5" stroke-width="18" stroke-linecap="round"/><circle cx="241" cy="43" r="13" fill="#fffdf5"/><path d="m252 42 48 8-47 8q-9-7-1-16" fill="#efb742"/><path d="m252 44 48 6" stroke="#dd9624" stroke-width="2"/><circle cx="245" cy="40" r="2.1" fill="#345049"/><path d="M157 84q17 4 29 14" fill="none" stroke="#dde6db" stroke-width="2"/><path d="M204 97q24 7 44 14" fill="none" stroke="#fffdf5" stroke-width="7" stroke-linecap="round"/></svg>`}
 document.querySelectorAll('.mc-app').forEach(app=>{
  const cache=new Map();let sample='1',scenario='complete',revealed=false;const timers=new Set();
  const state=model=>{const key=sample+model;if(!cache.has(key))cache.set(key,{draft:'',followups:[],scores:[0,0,0],note:''});return cache.get(key)};
  const notify=text=>{app.querySelector('.mc-toast')?.remove();const node=document.createElement('div');node.className='mc-toast';node.textContent=text;app.append(node);setTimeout(()=>node.remove(),2600)};
  function render(){
   for(const timer of timers)clearTimeout(timer);timers.clear();
   app.querySelector('.mc-chat-grid').innerHTML=['A','B'].map(model=>{
    const data=state(model),failed=scenario==='failed'&&model==='B',running=scenario==='running',name=revealed?(model==='A'?'DeepSeek V4.1 Flash':'GLM-5.3-Flash'):`结果 ${model}`;
    return `<section class="mc-window" data-model="${model}" data-fd-id="evaluation-chat-${model.toLowerCase()}"><header class="mc-window-header"><div class="mc-avatar">${model}</div><div><div class="mc-window-name">${name}</div><div class="mc-window-subtitle">独立会话 · 样本 ${sample}</div></div><span class="mc-spacer"></span><span class="mc-status" data-state="${failed?'failed':running?'running':'complete'}">${running?'<i class="mc-running-dot"></i>':'<span>'+(failed?'!':'✓')+'</span>'}<span class="mc-state-text">${failed?'生成失败':running?'思考中':'已完成'}</span></span><button class="mc-window-action mc-focus" title="展开此会话">⤢</button></header><div class="mc-messages" data-fd-id="evaluation-messages-${model.toLowerCase()}"><div class="mc-message mc-user"><div class="mc-bubble"><small>测评题目</small>${prompt}</div></div><div class="mc-message mc-assistant first-answer"><div class="mc-assistant-label"><span class="tiny-avatar">${model}</span><span>${name}</span><span class="mc-measure-tag">测评回答</span></div><details class="mc-thinking" ${running?'open':''}><summary>思考过程<small>${running?'实时展开':'点击展开'}</small></summary><div class="mc-thought-body">${running?'':thoughts.join('\n')}</div></details>${failed?'<div class="mc-error-message"><strong>本次生成未完成</strong><p>已保留收到的思考内容，可以查看原因或新增一次尝试。</p><button class="mc-button mc-retry">重试此结果</button></div>':`<div class="mc-answer" ${running?'hidden':''}><p>${model==='A'?'完成了。鹈鹕坐在车座上，双脚落在踏板两侧；车架和车轮保持完整连接。':'这里是生成的 SVG。我用长喙和喉囊突出鹈鹕特征，并把脚、踏板与车架分开表现。'}</p><div class="mc-art" data-fd-id="evaluation-artifact-${model.toLowerCase()}"><div class="mc-art-scene">${scene(model)}</div><div class="mc-art-foot"><span style="color:var(--color-owl-accent)">◇</span><strong>pelican-bicycle.svg</strong><span class="mc-spacer"></span><button class="mc-text-button mc-source">源码</button><button class="mc-text-button mc-expand-art">放大 ↗</button></div></div><div class="mc-assistant-actions"><button class="mc-text-button mc-copy">复制回答</button><button class="mc-text-button mc-source">查看源码</button></div></div>`}</div><div class="mc-followups"></div></div><div class="mc-composer" data-fd-id="evaluation-composer-${model.toLowerCase()}"><div class="mc-input-card"><textarea aria-label="追问结果 ${model}" placeholder="只追问结果 ${model}…" data-fd-id="evaluation-input-${model.toLowerCase()}" data-fd-editable="value"></textarea><div class="mc-composer-actions"><span>后续探索不计入本轮测评</span><span class="mc-spacer"></span><button class="mc-send" ${running?'disabled':''} aria-label="发送给结果 ${model}">↑</button></div></div></div><footer class="mc-window-footer"><button class="mc-check-link mc-checks" ${running?'disabled':''}>${running?'○ 检查待完成':failed?'! 查看失败信息':'✓ 自动检查'}</button><span class="mc-spacer"></span><button class="mc-score-link mc-score" ${running||failed?'disabled':''} data-fd-id="evaluation-score-${model.toLowerCase()}">${data.scores.every(Boolean)?'★ 已评价首次回答':'☆ 评价首次回答'}</button></footer></section>`;
   }).join('');
   for(const card of app.querySelectorAll('.mc-window')){const model=card.dataset.model;card.querySelector('textarea').value=state(model).draft;for(const item of state(model).followups)appendFollowup(card,item,false);wire(card)}
   app.querySelector('.mc-run-status').textContent=(scenario==='running'?'运行中':'已完成')+' · 2 个模型';
   if(scenario==='running')for(const card of app.querySelectorAll('.mc-window')){thoughts.forEach((line,index)=>{const timer=setTimeout(()=>{card.querySelector('.mc-thought-body').textContent+=line+'\n';if(card.querySelector('.mc-thinking').open)card.querySelector('.mc-messages').scrollTop=card.querySelector('.mc-messages').scrollHeight},700+index*1100);timers.add(timer)});const timer=setTimeout(()=>{card.querySelector('.mc-answer').hidden=false;card.querySelector('.mc-status').dataset.state='complete';card.querySelector('.mc-state-text').textContent='已完成';card.querySelector('.mc-send').disabled=false;card.querySelector('.mc-score').disabled=false;card.querySelector('.mc-checks').disabled=false;card.querySelector('.mc-checks').textContent='✓ 自动检查';card.querySelector('.mc-running-dot')?.remove();card.querySelector('.mc-thinking').open=false;card.querySelector('.mc-messages').scrollTop=card.querySelector('.mc-messages').scrollHeight},4600);timers.add(timer)}
  }
  function appendFollowup(card,text,withReply=true){const host=card.querySelector('.mc-followups');if(!host.children.length){const divider=document.createElement('div');divider.className='mc-followup-divider';divider.textContent='后续探索 · 不计入本轮测评';host.append(divider)}const user=document.createElement('div');user.className='mc-message mc-user';const bubble=document.createElement('div');bubble.className='mc-bubble';bubble.textContent=text;user.append(bubble);host.append(user);const answer=document.createElement('div');answer.className='mc-message mc-answer';answer.textContent='可以。可以进一步调整脚踏板的位置，让脚与踏板的连接更清楚，同时保留这份作品的整体构图。';host.append(answer);if(withReply)card.querySelector('.mc-messages').scrollTop=card.querySelector('.mc-messages').scrollHeight}
  function drawer(title,markup){app.querySelector('.mc-drawer-mask')?.remove();const mask=document.createElement('div');mask.className='mc-drawer-mask';mask.innerHTML=`<aside class="mc-drawer" role="dialog" aria-label="${title}"><header><h2>${title}</h2><button aria-label="关闭抽屉">×</button></header>${markup}</aside>`;app.append(mask);mask.querySelector('header button').onclick=()=>mask.remove();mask.onclick=event=>{if(event.target===mask)mask.remove()};return mask}
  function score(model){const data=state(model);const mask=drawer(`评价结果 ${model}`,`<p>评分对象：样本 ${sample} 的首次测评回答。后续追问不影响这次评分。</p>${rubric.map((label,index)=>`<div class="mc-rating-row"><strong>${label}</strong><div class="mc-rating-values" data-criterion="${index}">${[1,2,3,4,5].map(value=>`<button data-value="${value}" class="${data.scores[index]===value?'selected':''}">${value}</button>`).join('')}</div></div>`).join('')}<textarea aria-label="评价备注" placeholder="记录具体优点或问题…"></textarea><button class="mc-button primary mc-save-score">保存评分</button><button class="mc-text-button mc-skip-score">跳过评分并揭晓</button>`);mask.querySelector('textarea').value=data.note;mask.querySelectorAll('[data-value]').forEach(button=>button.onclick=()=>{const index=Number(button.parentElement.dataset.criterion);data.scores[index]=Number(button.dataset.value);button.parentElement.querySelectorAll('button').forEach(item=>item.classList.toggle('selected',item===button))});mask.querySelector('.mc-save-score').onclick=()=>{if(!data.scores.every(Boolean)){notify('请完成三个评价项');return}data.note=mask.querySelector('textarea').value;mask.remove();render();notify(`已保存结果 ${model} 的首次回答评分`)};mask.querySelector('.mc-skip-score').onclick=()=>{revealed=true;mask.remove();app.querySelector('.mc-identity-hint').textContent='模型已揭晓 · 首次回答与后续探索分别保留';render()}}
  function wire(card){const model=card.dataset.model;card.querySelector('textarea').addEventListener('input',event=>state(model).draft=event.target.value);card.querySelector('.mc-send').onclick=()=>{const input=card.querySelector('textarea'),text=input.value.trim();if(!text)return;state(model).followups.push(text);state(model).draft='';input.value='';appendFollowup(card,text)};card.querySelector('textarea').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();card.querySelector('.mc-send').click()}};card.querySelector('.mc-score').onclick=()=>score(model);card.querySelector('.mc-checks').onclick=()=>{if(scenario==='failed'&&model==='B'){drawer('结果 B · 失败信息','<p>示例状态：请求未正常完成。收到的思考内容已保留，未进行作品检查。</p><button class="mc-button">关闭后可新增一次尝试</button>');return}drawer(`结果 ${model} · 自动检查`,`<p>检查对应首次测评回答。</p>${['输出格式有效','独立预览与外部资源检查','浏览器渲染检查'].map(label=>`<div class="mc-check-row"><span>✓</span><div>${label}<small>通过 · 示例检查结果</small></div></div>`).join('')}`)};card.querySelectorAll('.mc-source').forEach(button=>button.onclick=()=>{const mask=drawer(`结果 ${model} · SVG 源码`,'<p>首次测评回答的作品源码</p><pre></pre>');mask.querySelector('pre').textContent=scene(model)});card.querySelector('.mc-expand-art')?.addEventListener('click',()=>drawer(`结果 ${model} · 作品预览`,`<div class="mc-art-scene" style="height:330px">${scene(model)}</div>`));card.querySelector('.mc-retry')?.addEventListener('click',()=>{notify('原型演示：新增一次尝试，保留失败记录');scenario='running';app.querySelector('.mc-scenario').value=scenario;render()});card.querySelector('.mc-copy')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(card.querySelector('.first-answer .mc-answer p').textContent);notify('已复制回答')}catch{notify('请选中回答文字后复制')}});card.querySelector('.mc-focus').onclick=()=>{const grid=app.querySelector('.mc-chat-grid');if(grid.classList.contains('mc-focused')){grid.classList.remove('mc-focused');card.classList.remove('is-focused')}else{grid.classList.add('mc-focused');card.classList.add('is-focused')}}}
  app.querySelector('.mc-scenario').onchange=event=>{scenario=event.target.value;render()};app.querySelector('.mc-sample').onchange=event=>{sample=event.target.value;render()};app.querySelector('.mc-reveal').onclick=()=>{const unscored=['A','B'].find(model=>!state(model).scores.every(Boolean));if(unscored){score(unscored);return}revealed=true;app.querySelector('.mc-identity-hint').textContent='模型已揭晓 · 首次回答与后续探索分别保留';render()};app.querySelectorAll('[data-demo-action]').forEach(button=>button.onclick=()=>{const action=button.dataset.demoAction;if(action==='prompt'){const mask=drawer('原始提示词','<p>每个模型使用同一道题、相同提示词。</p><pre></pre>');mask.querySelector('pre').textContent=prompt}else if(action==='summary')drawer('测评汇总','<p>原型重点展示会话对比。汇总保留首次测评回答的分项评分、耗时与费用。</p><p>后续探索作为各会话的独立记录查看。</p>');else notify('这版原型聚焦两个模型的会话对比')});render();
 });
})();
</script></body></html>
