[package]
name = "pire-desktop"
version = "0.1.0"
description = "pire desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
