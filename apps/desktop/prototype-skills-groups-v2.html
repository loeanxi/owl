<!DOCTYPE html>
<!-- PROTOTYPE v2 — 「组是组，项目是项目」：分组成为技能中心的独立 tab（组管理），
     组关联项目；项目 tab 只展示生效结果。?view=groups|project&modal=写作组 切换。用完即扔。 -->
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>原型 v2 · 组管理与项目关联</title>
<style>
	:root {
		--bg: #0b100d; --panel: #101812; --panel2: #14201a; --border: #21301f;
		--accent: #4ade80; --text: #e6ebe6; --muted: #93a39a; --faint: #5f6f66;
		--amber: #fbbf24; --red: #f87171; --sky: #7dd3fc; --violet: #c4b5fd;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body { background: var(--bg); color: var(--text); font: 13px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 28px 32px 96px; }
	.mono { font-family: Consolas, "Cascadia Mono", monospace; }
	h1 { font-size: 20px; margin-bottom: 4px; }
	.sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
	.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
	.btn { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
	.btn:hover { border-color: var(--accent); }
	.btn.primary { background: var(--accent); color: #08130b; border-color: var(--accent); font-weight: 600; }
	.btn.ghost { border-color: transparent; color: var(--muted); }
	.btn.danger { border-color: transparent; color: var(--red); }
	.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--muted); }
	.badge { font-size: 10px; border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; color: var(--faint); }
	.badge.personal { color: var(--accent); border-color: #22c55e55; }
	.badge.global { color: var(--sky); border-color: #38bdf855; }
	.badge.violet { color: var(--violet); border-color: #a78bfa55; }
	.badge.amber { color: var(--amber); border-color: #fbbf2455; }
	input[type=text], select { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12px; outline: none; }
	input[type=text]:focus { border-color: var(--accent); }
	input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
	.switch { position: relative; width: 34px; height: 19px; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .15s; flex: none; display: inline-block; }
	.switch.on { background: var(--accent); }
	.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .15s; }
	.switch.on::after { left: 17px; }
	.rowline { display: flex; align-items: center; gap: 8px; }
	.section-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
	.count { color: var(--faint); font-weight: 400; }

	/* 顶部 tab（技能中心的个人/全局/项目/分组） */
	.tabs { display: flex; gap: 8px; margin-bottom: 6px; }
	.tabs button { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 16px; font-size: 12px; cursor: pointer; }
	.tabs button.active { background: var(--accent); border-color: var(--accent); color: #08130b; font-weight: 600; }
	.roothead { font-family: Consolas, monospace; font-size: 11px; color: var(--faint); margin-bottom: 14px; }

	/* 分组 tab */
	.group-list { display: flex; flex-direction: column; gap: 10px; }
	.group-row { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
	.g-skills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
	.g-skills .chip { font-family: Consolas, monospace; color: var(--text); }
	.proj-assoc { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
	.proj-assoc .chip { font-size: 11px; }

	/* 项目 tab（简化） */
	.group-brief { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
	.flat-list { margin-top: 4px; }
	.flat-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid #16211a; font-size: 12px; }
	.flat-row:last-child { border-bottom: none; }
	.from { font-size: 10px; color: var(--violet); }
	.from.solo { color: var(--faint); }

	/* 弹窗 */
	.mask { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; align-items: center; justify-content: center; }
	.modal { width: min(680px, 92vw); max-height: 84vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
	.modal h3 { font-size: 14px; margin-bottom: 12px; }
	.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; margin-top: 8px; }
	.mgrid label { display: flex; gap: 7px; align-items: center; font-size: 12px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
	.mgrid label:hover { background: var(--panel2); }
	.mfoot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

	#switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
		background: #000; border: 1px solid #3a3; border-radius: 999px; padding: 6px 10px; z-index: 99; box-shadow: 0 6px 24px #000c; }
	#switcher button { background: none; border: none; color: #3f6; font-size: 16px; cursor: pointer; padding: 0 6px; }
	#switcher .label { color: #cfc; font-size: 12px; min-width: 260px; text-align: center; }
	.proto-note { position: fixed; bottom: 18px; right: 18px; color: var(--faint); font-size: 11px; z-index: 99; }
</style>
</head>
<body>
	<h1>原型 v2 · 组是组，项目是项目</h1>
	<div class="sub">分组升级为技能中心的一等公民（独立「分组」tab，负责成员 + 关联哪些项目）；项目 tab 退化成纯生效视图。底部悬浮条切换「分组管理 / 项目视角」，本页数据联动：改关联，项目那边立刻变。</div>
	<div id="app"></div>
	<div id="switcher">
		<button onclick="cycle(-1)">←</button>
		<span class="label" id="sw-label"></span>
		<button onclick="cycle(1)">→</button>
	</div>
	<div class="proto-note">PROTOTYPE · 用完即扔</div>

<script>
const PERSONAL = ["loean7-codingfollow","loean7-cosplay","loean7-cursorson","loean7-fakecommit","loean7-grammar","loean7-journal-business","loean7-journal-coding","loean7-journal-question","loean7-map-change","loean7-map-eli5","loean7-map-sql","loean7-nenglish","loean7-pagestest","loean7-push","loean7-skillhub","loean7-taskbreak","loean7-usagereport","loean7-video","loean7-yunbug","loean7-yunbugpush","loean7-yunbugrework","loean7-yunneed"];
const GLOBAL = ["ask-matt","batch-grill-me","browser-use","claude-handoff","cloud","code-review","codebase-design","design-an-interface","diagnosing-bugs","domain-modeling","edit-article","frontend-design","git-guardrails-claude-code","grill-me","grill-with-docs","grilling","handoff","implement","improve-codebase-architecture","loop-me","migrate-to-shoehorn","obsidian-vault","open-source","prototype","qa","remote-browser","request-refactor-plan","research","resolving-merge-conflicts","scaffold-exercises","setup-matt-pocock-skills","setup-pre-commit","setup-ts-deep-modules","tdd","teach","to-questionnaire","to-spec","to-tickets","triage","typesafe-ai","ubiquitous-language","wayfinder","web-design-guidelines","wizard","writing-beats","writing-fragments","writing-great-skills","writing-shape","x402"];
const SRC = n => PERSONAL.includes(n) ? "个人" : "全局";
const srcBadge = n => SRC(n) === "个人" ? '<span class="badge personal">个人</span>' : '<span class="badge global">全局</span>';

const projects = ["D:\\owl\\Owl-def", "D:\\owl\\owl-re-v1", "D:\\blog\\hexo-site"];
const groups = [
	{ name: "写作组", skills: ["loean7-journal-business","loean7-journal-coding","loean7-journal-question","loean7-grammar","loean7-nenglish","writing-beats"], projects: ["D:\\owl\\Owl-def", "D:\\blog\\hexo-site"] },
	{ name: "开发组", skills: ["loean7-codingfollow","loean7-yunbug","loean7-push","code-review","tdd","implement","diagnosing-bugs"], projects: ["D:\\owl\\Owl-def", "D:\\owl\\owl-re-v1"] },
	{ name: "爬取组", skills: ["browser-use","remote-browser","cloud"], projects: [] },
];
const solo = { "D:\\owl\\Owl-def": ["grilling","writing-great-skills"], "D:\\owl\\owl-re-v1": ["qa"], "D:\\blog\\hexo-site": [] };
let activeProject = projects[0];
let editingGroup = null;

const groupShortName = p => p.split("\\").pop();
const projectGroups = p => groups.filter(g => g.projects.includes(p));
function effectiveSkills(p) {
	const map = new Map();
	projectGroups(p).forEach(g => g.skills.forEach(s => { if (!map.has(s)) map.set(s, g.name); }));
	(solo[p] || []).forEach(s => { if (!map.has(s)) map.set(s, "__solo"); });
	return map;
}

function headTabs(active) {
	return `<div class="tabs">
		<button class="${active==="personal"?"active":""}" onclick="alert('原型：个人 tab（技能 CRUD，不变）')">个人 22</button>
		<button class="${active==="global"?"active":""}" onclick="alert('原型：全局 tab（技能 CRUD，不变）')">全局 49</button>
		<button class="${active==="project"?"active":""}" onclick="go('project')">项目</button>
		<button class="${active==="groups"?"active":""}" onclick="go('groups')">分组 ${groups.length}</button>
	</div>`;
}

// ---------- 分组管理 tab ----------
function groupsView() {
	return `${headTabs("groups")}
	<div class="roothead">分组是全局的技能集合；把组关联到项目，组内技能即对项目生效。项目里不再做分组操作。</div>
	<div class="rowline" style="margin-bottom:12px">
		<span class="chip">组内技能可来自 个人 / 全局</span>
		<span style="flex:1"></span>
		<button class="btn primary" onclick="editingGroup={name:'',skills:[],projects:[]};render()">+ 新建分组</button>
	</div>
	<div class="group-list">
		${groups.map((g, i) => `<div class="group-row">
			<div class="rowline">
				<span class="badge violet">分组</span>
				<b style="font-size:13px">${g.name}</b>
				<span class="count">${g.skills.length} 个技能</span>
				<span class="count">·</span>
				<span class="count">${g.projects.length ? "关联 " + g.projects.length + " 个项目" : "未关联项目"}</span>
				<span style="flex:1"></span>
				<button class="btn" onclick="editingGroup=groups[${i}];render()">编辑</button>
				<button class="btn danger" onclick="if(confirm('删除分组「${g.name}」？（不影响技能文件与项目）')){groups.splice(${i},1);render()}">删除</button>
			</div>
			<div class="g-skills">${g.skills.map(s => `<span class="chip">${s}</span>`).join("")}</div>
			<div class="proj-assoc">
				<span class="count" style="font-size:11px">关联项目：</span>
				${g.projects.length ? g.projects.map(p => `<span class="chip">${groupShortName(p)}</span>`).join("") : '<span class="count" style="font-size:11px">（无 —— 任何项目都不生效）</span>'}
			</div>
		</div>`).join("")}
	</div>
	${editingGroup ? groupModal() : ""}`;
}

function groupModal() {
	const isNew = !groups.includes(editingGroup);
	return `<div class="mask" onclick="if(event.target===this){editingGroup=null;render()}">
		<div class="modal">
			<h3>${isNew ? "新建分组" : "编辑分组 · " + editingGroup.name}</h3>
			<div class="rowline" style="margin-bottom:6px">
				<span style="width:52px;color:var(--muted);font-size:12px">组名</span>
				<input type="text" value="${editingGroup.name}" style="flex:1"
					oninput="editingGroup.name=this.value">
			</div>
			<div class="section-title">成员技能 <span class="count">来自个人 / 全局，可跨来源</span></div>
			<div class="mgrid">
				${[...PERSONAL.map(n=>({n,src:"个人"})), ...GLOBAL.map(n=>({n,src:"全局"}))].map(({n,src}) => `
					<label><input type="checkbox" ${editingGroup.skills.includes(n)?"checked":""}
						onchange="this.checked?editingGroup.skills.push('${n}'):editingGroup.skills=editingGroup.skills.filter(x=>x!=='${n}');render()">
					<span class="mono">${n}</span><span style="flex:1"></span>
					<span class="badge ${src==="个人"?"personal":"global"}">${src}</span></label>`).join("")}
			</div>
			<div class="section-title">关联项目 <span class="count">勾选的项目，组内技能全部生效</span></div>
			<div class="mgrid">
				${projects.map(p => `
					<label><input type="checkbox" ${editingGroup.projects.includes(p)?"checked":""}
						onchange="this.checked?editingGroup.projects.push('${p}'):editingGroup.projects=editingGroup.projects.filter(x=>x!=='${p}');render()">
					<span class="mono" style="font-size:11px">${p}</span></label>`).join("")}
			</div>
			<div class="mfoot">
				${!isNew ? '<button class="btn danger" onclick="groups.splice(groups.indexOf(editingGroup),1);editingGroup=null;render()">删除分组</button>' : ""}
				<span style="flex:1"></span>
				<button class="btn" onclick="editingGroup=null;render()">取消</button>
				<button class="btn primary" onclick="if(isNewLike()){groups.push(editingGroup)} editingGroup=null;render()">保存</button>
			</div>
		</div>
	</div>`;
}
function isNewLike() { return !groups.includes(editingGroup); }

// ---------- 项目 tab（简化：只看生效结果） ----------
function projectView() {
	const eff = effectiveSkills(activeProject);
	const gs = projectGroups(activeProject);
	return `${headTabs("project")}
	<div class="roothead">项目只负责自己的技能目录与生效结果；组的接入/断开去「分组」tab 操作。</div>
	<div class="rowline" style="margin-bottom:14px;gap:8px">
		<select onchange="activeProject=this.value;render()" style="min-width:320px">
			${projects.map(p => `<option ${p===activeProject?"selected":""}>${p}</option>`).join("")}
		</select>
		<input type="text" placeholder="添加项目路径，回车" style="flex:1;min-width:220px">
		<button class="btn">添加项目</button>
		<span style="flex:1"></span>
		<span class="chip" style="color:var(--accent)">生效 ${eff.size} 个</span>
	</div>

	<div class="section-title">已关联的组 <span class="count">开关 = 该组对本项目生效；去「分组」tab 管理成员</span></div>
	${gs.length ? gs.map((g, i) => `<div class="group-brief">
		<span class="switch on" title="原型：断开关联" onclick="if(confirm('断开「${g.name}」与本项目？')){g=groups[${groups.indexOf(g)}];g.projects=g.projects.filter(x=>x!=='${activeProject}');render()}"></span>
		<b style="font-size:12px">${g.name}</b>
		<span class="count">${g.skills.length} 个技能生效</span>
		<span style="flex:1"></span>
		<span class="chip" style="cursor:pointer" onclick="editingGroup=groups[${groups.indexOf(g)}];render()">编辑成员 →</span>
	</div>`).join("") : '<div class="panel" style="color:var(--faint);font-size:12px">没有关联的组 —— 去「分组」tab 建组并关联本项目</div>'}

	<div class="section-title">生效技能清单 <span class="count">来自关联组 + 项目内单独添加</span>
		<span style="flex:1"></span><button class="btn" onclick="alert('原型：从个人/全局挑一个技能单独加进本项目')">+ 单独添加技能</button></div>
	<div class="panel" style="padding:0">
		<div class="flat-list">
			${[...eff.entries()].map(([name, from]) => `<div class="flat-row">
				<input type="checkbox" checked title="原型：取消勾选 = 项目内禁用">
				<span class="mono">${name}</span>
				${srcBadge(name)}
				${from !== "__solo" ? `<span class="from">来自 ${from}</span>` : '<span class="from solo">单独添加</span>'}
				<span style="flex:1"></span>
				${from !== "__solo" ? "" : '<button class="btn ghost" onclick="solo[activeProject]=solo[activeProject].filter(x=>x!==\'' + name + '\');render()">移除</button>'}
			</div>`).join("")}
		</div>
	</div>
	<div style="color:var(--faint);font-size:11px;margin-top:8px">提示：清单的勾选 = 项目内启用/禁用（同现有 opt-out 机制）；组的接入与断开在「分组」tab。</div>`;
}

// ---------- 路由 ----------
const VIEWS = [
	{ key: "groups", name: "分组管理（技能中心第 4 个 tab）", render: groupsView },
	{ key: "project", name: "项目视角（简化后）", render: projectView },
];
function currentView() {
	const v = new URLSearchParams(location.search).get("view") ?? "groups";
	return VIEWS.find(x => x.key === v) ?? VIEWS[0];
}
function render() {
	const params = new URLSearchParams(location.search);
	if (params.get("modal")) editingGroup = groups.find(g => g.name === params.get("modal")) ?? editingGroup;
	const v = currentView();
	document.getElementById("app").innerHTML = v.render();
	document.getElementById("sw-label").textContent = v.name;
}
function go(key) { const url = new URL(location); url.searchParams.set("view", key); url.searchParams.delete("modal"); history.replaceState(null, "", url); render(); }
function cycle(dir) {
	const i = VIEWS.indexOf(currentView());
	const next = VIEWS[(i + dir + VIEWS.length) % VIEWS.length];
	go(next.key);
}
render();
</script>
</body>
</html>
